name: Check

# The version gate lives in test/version.test.ts: a bump must move
# package.json, dsh.plugin.json, and both READMEs (npm install command plus
# the pinned tarball) together, and the release workflow must keep its npm
# publish job — pnpm test fails on any drift. This workflow is the CI seat
# for the whole `check` script (typecheck, tests, build).

on:
  push:
    branches:
      - master
  pull_request:
  # release.yml calls this workflow so a tag cuts a Release only after the
  # same gate master runs has gone green — one definition, two entry points.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11
      # Node 24 LTS: the test suite is type-stripped TS run directly by
      # node --test, which needs a Node with type stripping on by default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
        # No --ignore-workspace: pnpm 11 reads build-script approvals
        # (allowBuilds in pnpm-workspace.yaml) only through the workspace
        # file; skipping it leaves esbuild's postinstall unapproved and
        # fails with ERR_PNPM_IGNORED_BUILDS.
      - name: Typecheck, test, build
        run: pnpm run check
